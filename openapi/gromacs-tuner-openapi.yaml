  /api/tuner_runs/{tuner_run_id}:
    delete:
      summary: Delete a tuner run.
      description: "Deletes a tuning run and removes associated results."
      parameters:
        - name: tuner_run_id
          in: path
          required: true
          schema:
            type: string
          description: "Unique identifier of the tuning run."
      responses:
        "200":
          description: "tuning run successfully deleted."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: "Status message confirming deletion."

  /api/tuner_runs/{tuner_run_id}/status:
    get:
      summary: Retrieve the status of a tuning run.
      description: "Fetches the current status of a tuning run."
      parameters:
        - name: tuner_run_id
          in: path
          required: true
          schema:
            type: string
          description: "Unique identifier of the tuning run."
      responses:
        "200":
          description: "Current status of the tuning run."
          content:
            application/json:
              schema:
                type: object
                properties:
                  tuner_run_id:
                    type: string
                    description: "Identifier of the tuning run."
                  status:
                    type: string
                    description: "Current status of the tuning process."
