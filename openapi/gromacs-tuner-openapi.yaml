openapi: 3.0.0
info:
  title: "GROMACS Tuner API"
  version: "1.1"
  description: "API for submitting tuning requests to gromacs-tuner."

paths:
  /api/tuner_runs:
    post:
      summary: Submit a `.tpr` file for tuning.
      description: |
        Uploads a `.tpr` file and starts a tuning process.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "The `.tpr` file for the simulation to be tuned."
                tuning_options:
                  type: object
                  additionalProperties: true
                  description: |
                    Optional constraints for tuning (e.g., CPU range, memory, DD, OMP). 
                    This is an open-ended JSON object, and its structure may evolve.
      responses:
        "200":
          description: "Tuning run successfully started."
          content:
            application/json:
              schema:
                type: object
                properties:
                  tuner_run_id:
                    type: string
                    description: "Unique identifier for the tuning run."
                  status:
                    type: string
                    description: "Current status of the tuning run."

