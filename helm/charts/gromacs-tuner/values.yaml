image:
  repository: cerit.io/adamondrejka/gromacs-tuner-api
  tag: "1.2"
  pullPolicy: Always

ingress:
  enabled: false
  host: "gromacs-tuner.local"

# API resources
api:
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
    requests:
      cpu: "0.5"
      memory: "1Gi"

# Storage configuration
storage:
  size: "100Gi"
  storageClassName: "nfs-csi"

# Ray cluster configuration
ray:
  version: "2.42.1"
  image: "cerit.io/adamondrejka/gmx-cuda-ray-2-42-1-with-user"
  autoscaler:
    idleTimeoutSeconds: 3600  # 1 hour

  head:
    resources:
      limits:
        cpu: "1"
        memory: "8Gi"
      requests:
        cpu: "500m"
        memory: "4Gi"

  worker:
    replicas: 0
    minReplicas: 0
    maxReplicas: 5
    numCpu: 32
    numGpu: 1
    nodeSelector:
      nvidia.com/gpu.product: "NVIDIA-A40"
    resources:
      limits:
        cpu: "32"
        memory: "128Gi"
        nvidia.com/gpu: "1"
      requests:
        cpu: "32"
        memory: "16Gi"
        nvidia.com/gpu: "1"
