apiVersion: ray.io/v1
kind: RayCluster
metadata:
  labels:
    controller-tools.k8s.io: "1.0"
  name: {{ .Release.Name }}-raycluster
  namespace: {{ .Release.Namespace }}
spec:
  rayVersion: {{ .Values.ray.version }}

  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-cpus: '0'
    template:
      metadata:
        labels: {}
      spec:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

        containers:
        - name: ray-head
          image: {{ .Values.ray.image }}

          ports:
            - { containerPort: 6379, name: gcs }
            - { containerPort: 8265, name: dashboard }
            - { containerPort: 10001, name: client }

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","ray stop"]

          volumeMounts:
            - { mountPath: /tmp/ray, name: ray-logs }
            - { mountPath: /data,    name: {{ .Release.Name }}-pvc }

          resources:
            limits:
              cpu: {{ .Values.ray.head.resources.limits.cpu }}
              memory: {{ .Values.ray.head.resources.limits.memory }}
            requests:
              cpu: {{ .Values.ray.head.resources.requests.cpu }}
              memory: {{ .Values.ray.head.resources.requests.memory }}

          securityContext:
            runAsUser: 1000
            runAsGroup: 100
            capabilities: { drop: [ "ALL" ] }
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }

        volumes:
          - { name: ray-logs, emptyDir: {} }
          - { name: gromacs-pvc, persistentVolumeClaim: { claimName: gromacs-pvc } }

  workerGroupSpecs:
  - replicas: {{ .Values.ray.worker.replicas }}
    minReplicas: {{ .Values.ray.worker.replicas }}
    maxReplicas: {{ .Values.ray.worker.replicas }}
    groupName: gromacs-group
    rayStartParams:
      num-cpus: '32'
      num-gpus: '1'

    template:
      spec:
        nodeSelector:
          {{- toYaml .Values.ray.worker.nodeSelector | nindent 10 }}

        securityContext:
          fsGroup: 1000                     # pod‑level
          fsGroupChangePolicy: OnRootMismatch
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault

        containers:
        - name: ray-worker
          image: {{ .Values.ray.image }}

          lifecycle:
            preStop:
              exec: { command: ["/bin/sh","-c","ray stop"] }

          volumeMounts:
            - { mountPath: /tmp/ray,         name: ray-logs }
            - { mountPath: /tmp/tpr,         name: gromacs-pvc }
            - { mountPath: /tmp/ray_gmx_logs, name: gromacs-logs }
            - { mountPath: /data,            name: gromacs-pvc }  # ← new

          resources:
            {{- toYaml .Values.ray.worker.resources | nindent 12 }}

          securityContext:
            runAsUser: 1000
            runAsGroup: 100
            capabilities: { drop: [ "ALL" ] }
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }

        volumes:
          - { name: ray-logs,      emptyDir: {} }
          - { name: gromacs-logs, emptyDir: {} }
          - { name: gromacs-pvc,  persistentVolumeClaim: { claimName: gromacs-pvc } }
